<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Inscripción Curso</title>
<link rel="stylesheet" href="styles.css">
 
 </head>
 
<style>
     @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;500;700&display=swap');
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
}
{
  font-family: "Lucida Handwriting", Times, Cursive;
}

body {
    background-color: #f0f4f9; /* Fondo gris-azulado claro típico de Google */
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    color: #3c4043;
}
 {
  font-family: "Times New Roman", Times, serif;
 }
/* ==========================================
   Contenedor del Formulario (Estilo Google Forms / Card)
   ========================================== */
.form-container {
    background-color: #ffffff;
    width: 100%;
    max-width: 720px;
    padding: 32px 40px;
    border-radius: 8px;
    border: 1px solid #dadce0; /* Borde sutil característico de Google */
    box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); /* Sombra suave Material Design */
}

/* ==========================================
   Encabezado Estilo Google
   ========================================== */
.form-header {
    text-align: left; /* Google suele alinear a la izquierda */
    margin-bottom: 16px;
}

.form-header h1 {
    color: #202124;
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 6px;
}

.form-header p {
    color: #5f6368;
    font-size: 14px;
}

/* Divisores limpios */
.divider {
    border: 0;
    border-top: 1px solid #dadce0;
    margin: 24px 0;
}

/* ==========================================
   Grupos de formulario e Inputs
   ========================================== */
.form-group {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
}

label {
    font-size: 14px;
    color: #202124;
    margin-bottom: 8px;
    font-weight: 500;
}

/* Estilos de Inputs / Selects / Textarea estilo Material */
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
select,
textarea {
    padding: 12px 14px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    font-size: 14px;
    color: #202124;
    background-color: #fff;
    width: 100%;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

/* Efecto de Foco Color Azul Google */
input:focus, 
select:focus, 
textarea:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
}

textarea {
    resize: vertical;
}

/* ==========================================
   Estructuras de Fila (Grid)
   ========================================== */
.row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
}

.row-3-address {
    display: grid;
    grid-template-columns: 1fr 1fr 0.6fr; 
    gap: 16px;
}

/* ==========================================
   Botones de Radio (Estilo Material)
   ========================================== */
.radio-group {
    display: flex;
    gap: 24px;
    margin-top: 4px;
}

.radio-label {
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: normal;
    color: #202124;
    cursor: pointer;
}

.radio-label input[type="radio"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid #5f6368;
    border-radius: 50%;
    margin-right: 8px;
    outline: none;
    transition: border-color 0.2s;
    position: relative;
    cursor: pointer;
}

.radio-label input[type="radio"]:checked {
    border-color: #1a73e8;
}

.radio-label input[type="radio"]:checked::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 8px;
    height: 8px;
    background-color: #1a73e8;
    border-radius: 50%;
}

/* ==========================================
   Footer y Botón Principal (Azul Google)
   ========================================== */
.form-footer {
    display: flex;
    justify-content: flex-end; /* Google suele alinear los botones a la derecha */
    margin-top: 24px;
}

.btn-enviar {
    background-color: #1a73e8; /* Azul oficial de Google */
    color: white;
    border: none;
    padding: 10px 24px;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
    box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
    transition: background-color 0.2s, box-shadow 0.2s;
}

.btn-enviar:hover {
    background-color: #1557b0;
    box-shadow: 0 1px 3px 1px rgba(60,64,67,0.15);
}

/* ==========================================
   Responsive para pantallas pequeñas
   ========================================== */
@media (max-width: 600px) {
    .row-2, .row-3, .row-3-address {
        grid-template-columns: 1fr;
        gap: 16px;
    }
    
    .form-container {
        padding: 20px;
    }

    .form-footer {
        justify-content: center;
    }

    .btn-enviar {
        width: 100%;
    }
}
</style>
<body>


<div class="form-container">


<header class="form-header">

<h1>Formulario de Inscripción Curso</h1>

<p>Rellene cuidadosamente el formulario de inscripción</p>

</header>


<hr class="divider">

<form action="#" method="POST" id="registroForm">


<div class="form-group">

<label>Nombre del alumno</label>
<div class="row-3">
<input type="text" placeholder="Nombre" required>
<input type="text" placeholder="Segundo Nombre">
<input type="text" placeholder="Apellido" required>
</div>
</div>


<div class="row-2">
<div class="form-group">
<label for="fecha">Fecha de nacimiento</label>

<input type="date" id="fecha" required>
</div>
<div class="form-group">
<label for="genero">Género</label>
<select id="genero">
<option value="" disabled selected>Seleccione</option>

<option value="masculino">Masculino</option>
<option value="femenino">Femenino</option>
<option value="otro">Otro</option>
</select>
</div>
</div>


<div class="form-group">
<label for="direccion1">Dirección</label>
<input type="text" id="direccion1" placeholder="Dirección de la calle" required>
</div>



<div class="form-group">

<label for="direccion2">Dirección de la calle Línea 2</label>

<input type="text" id="direccion2">

</div>



<div class="row-3-address">

<div class="form-group">

<label for="ciudad">Ciudad</label>

<input type="text" id="ciudad" required>

</div>

<div class="form-group">

<label for="estado">Estado / Provincia</label>

<input type="text" id="estado" required>

</div>

<div class="form-group">

<label for="cp">Código Postal</label>

<input type="text" id="cp" required>

</div>

</div>





<div class="row-2">

<div class="form-group">

<label for="email">Email</label>

<input type="email" id="email" required>

</div>

<div class="form-group">

<label for="telefono">Número de teléfono</label>

<input type="tel" id="telefono" required>

</div>

</div>



<!-- Sección Cursos Previos -->

<div class="form-group">

<label>Ha recibido otros cursos Anteriormente</label>

<div class="radio-group">

<label class="radio-label">

<input type="radio" name="cursos_previos" value="si"> Si

</label>

<label class="radio-label">

<input type="radio" name="cursos_previos" value="no"> No

</label>

</div>

</div>



<!-- Sección Empresa y Curso -->

<div class="row-2">

<div class="form-group">

<label for="empresa">Empresa</label>

<input type="text" id="empresa">

</div>

<div class="form-group">

<label for="curso">Cursos</label>

<select id="curso">

<option value="" disabled selected>Seleccione un curso</option>

<option value="html">HTML & CSS</option>

<option value="js">JavaScript</option>

<option value="python">Python</option>

</select>

</div>

</div>



<!-- Comentarios -->

<div class="form-group">

<label for="comentarios">Comentarios adicionales</label>

<textarea id="comentarios" rows="4"></textarea>

</div>



<hr class="divider">



<!-- Botón Enviar -->

<div class="form-footer">

<button type="submit" class="btn-enviar">Enviar</button>

</div>



</form>

</div>



</body>

</html>
